<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Fundo escuro -->
  <rect width="200" height="200" fill="#020204"/>
  
  <!-- Definições de efeitos -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="voidGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6ba3ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#4a8eff;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <!-- Anel externo -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#voidGradient)" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Anel interno -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#6ba3ff" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Centro com ponto brilhante -->
  <circle cx="100" cy="100" r="8" fill="#6ba3ff" filter="url(#glow)"/>
  
  <!-- Padrão de linhas que representam a interface/código -->
  <line x1="60" y1="100" x2="80" y2="100" stroke="#6ba3ff" stroke-width="1" opacity="0.7"/>
  <line x1="120" y1="100" x2="140" y2="100" stroke="#6ba3ff" stroke-width="1" opacity="0.7"/>
  <line x1="100" y1="60" x2="100" y2="80" stroke="#6ba3ff" stroke-width="1" opacity="0.7"/>
  <line x1="100" y1="120" x2="100" y2="140" stroke="#6ba3ff" stroke-width="1" opacity="0.7"/>
</svg>