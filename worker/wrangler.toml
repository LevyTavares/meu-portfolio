name = "meu-portfolio-api"
main = "src/index.ts"
compatibility_date = "2025-07-18"

[observability]
enabled = false

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[env.production]
vars = { RESEND_API_KEY = "", CONTACT_TO_EMAIL = "" }
